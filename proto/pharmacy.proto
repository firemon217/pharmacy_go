syntax = "proto3";

package pharmacy.v1;

option go_package = "pharmacy/pb;pb";

service Pharmacy {
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc GetByID(GetByIDRequest) returns (MedicineResponse);
  rpc Sell(SellRequest) returns (Empty);
}

message Medicine {
  string id = 1;
  string name = 2;
  string manufacturer = 3;
  double price = 4;
  bool prescription = 5;
  int32 quantity = 6;
}

message CreateRequest {
  string name = 1;
  string manufacturer = 2;
  double price = 3;
  bool prescription = 4;
  int32 quantity = 5;
}

message CreateResponse {
  string id = 1;
}

message GetByIDRequest {
  string id = 1;
}

message MedicineResponse {
  Medicine medicine = 1;
}

message SellRequest {
  string id = 1;
  int32 count = 2;
}

message Empty {}
